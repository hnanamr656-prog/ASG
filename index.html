<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
}

/* ===== Splash Screen ===== */
.splash{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#000,#111);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  transition:opacity 0.8s ease;
}

.splash img{
  width:120px;
  height:120px;
  border-radius:50%;
  box-shadow:0 0 25px rgba(0,255,204,0.4);
  animation: pulse 1.5s infinite;
}

.splash h1{
  color:#fff;
  margin-top:15px;
  font-size:20px;
  letter-spacing:2px;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.1);}
  100%{transform:scale(1);}
}

/* ===== App Frame ===== */
.app{
  width:380px;
  height:90vh;
  background:#000;
  border-radius:35px;
  overflow:hidden;
  box-shadow:0 0 30px rgba(0,255,204,0.15);
  border:2px solid rgba(255,255,255,0.08);
  display:flex;
  flex-direction:column;
  opacity:0;
  transform:translateY(20px);
  transition:0.8s ease;
}

.app.show{
  opacity:1;
  transform:translateY(0);
}

/* Header */
.header{
  padding:18px;
  text-align:center;
  background:#0a0a0a;
  border-bottom:1px solid #222;
}

.header h1{
  margin:0;
  color:#fff;
  font-size:22px;
}

/* Content */
.container{
  padding:15px;
  overflow-y:auto;
}

/* Logo */
.logo img{
  width:90px;
  height:90px;
  border-radius:50%;
  display:block;
  margin:10px auto;
}

/* Icons */
.icons{
  text-align:center;
  margin:10px 0;
}

.icons a{
  color:#fff;
  margin:0 10px;
  font-size:20px;
  transition:0.3s;
}

.icons a:hover{
  color:#00ffcc;
  transform:scale(1.2);
}

/* Buttons */
.link{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#111;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  text-decoration:none;
  color:#fff;
  transition:0.3s;
}

.link:hover{
  background:#00ffcc;
  color:#000;
  transform:scale(1.03);
}

.link:active{
  transform:scale(0.95);
}

/* Dropdown */
.dropdown{
  max-height:0;
  overflow:hidden;
  transition:max-height 0.6s ease;
}

.dropdown.open{
  max-height:900px;
}

/* Arrow */
.arrow{
  transition:0.3s;
}

.arrow.rotate{
  transform:rotate(180deg);
}

/* Footer */
.footer{
  text-align:center;
  font-size:11px;
  color:#666;
  padding:10px;
}
</style>
</head>
