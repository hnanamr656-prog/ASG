<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">

<title>ASG App</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#000,#111);
  font-family: Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* إطار الموبايل */
.app{
  width:380px;
  height:90vh;
  background:#000;
  border-radius:35px;
  overflow:hidden;
  box-shadow:0 0 30px rgba(0,255,204,0.2);
  border:2px solid rgba(255,255,255,0.1);
  display:flex;
  flex-direction:column;
}

/* الهيدر */
.header{
  padding:20px;
  text-align:center;
  background:#0a0a0a;
  border-bottom:1px solid #222;
}

.header h1{
  margin:0;
  font-size:22px;
  color:#fff;
}

/* المحتوى */
.container{
  padding:15px;
  overflow-y:auto;
}

/* اللوجو */
.logo img{
  width:90px;
  height:90px;
  border-radius:50%;
  margin:10px auto;
  display:block;
}

/* أيقونات */
.icons{
  text-align:center;
  margin:10px 0;
}
.icons a{
  color:#fff;
  margin:0 10px;
  font-size:20px;
}
.icons a:hover{
  color:#00ffcc;
}

/* زرار */
.link{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#111;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  text-decoration:none;
  color:#fff;
  transition:0.3s;
}

.link:hover{
  background:#00ffcc;
  color:#000;
  transform:scale(1.03);
}

.link:active{
  transform:scale(0.95);
}

/* dropdown */
.dropdown{
  max-height:0;
  overflow:hidden;
  transition:0.5s;
}

.dropdown.open{
  max-height:700px;
}

/* سهم */
.arrow{
  transition:0.3s;
}
.arrow.rotate{
  transform:rotate(180deg);
}

/* footer */
.footer{
  text-align:center;
  font-size:11px;
  color:#666;
  padding:10px;
}
</style>
</head>
