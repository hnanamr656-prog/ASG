<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>ASG</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#000;
  color:#fff;
  text-align:center;
}

.container{
  max-width:420px;
  margin:auto;
  padding:30px 20px;
}

.logo img{
  width:90px;
  height:90px;
  border-radius:50%;
  margin:20px auto;
  box-shadow:0 0 15px rgba(0,255,204,0.3);
}

/* العنوان */
h1{font-size:20px;}
.sub{color:#aaa; font-size:13px; margin-bottom:20px;}

/* أيقونات */
.icons a{
  color:#fff;
  margin:0 10px;
  font-size:22px;
  transition:0.3s;
}
.icons a:hover{
  color:#00ffcc;
  transform:scale(1.2);
}

/* اللينكات */
.link{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  background:#111;
  padding:15px;
  margin:10px 0;
  border-radius:12px;
  text-decoration:none;
  color:#fff;
  transition:0.25s;
  border:1px solid rgba(255,255,255,0.05);
}

.link:hover{
  background:#00ffcc;
  color:#000;
  transform:scale(1.04);
}

/* تأثير ضغط */
.link:active{
  transform:scale(0.96);
}

/* زر التليجرام */
.toggle{
  cursor:pointer;
}

/* السهم */
.arrow{
  transition:0.3s;
}

.arrow.rotate{
  transform:rotate(180deg);
}

/* قائمة التليجرام */
.telegram-list{
  max-height:0;
  overflow:hidden;
  transition:max-height 0.6s ease;
}

.telegram-list.open{
  max-height:700px;
}

/* أنيميشن */
.telegram-list a{
  opacity:0;
  transform:translateY(-10px);
  transition:0.4s;
}

.telegram-list.open a{
  opacity:1;
  transform:translateY(0);
}

/* الفوتر */
.footer{
  margin-top:20px;
  font-size:11px;
  color:#666;
}
</style>
</head>

<body>

<div class="container">

  <img src="logo.jpeg">
</div>

  <a href="https://vm.tiktok.com/ZS9LDyxJKUwce-u38nm/"><i class="fab fa-tiktok"></i></a>

</body>
